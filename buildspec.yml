version: 0.2

phases:
  install:
    runtime-versions:
      python: latest
    commands:
      - echo Installing Terraform...
      - curl -o terraform.zip https://releases.hashicorp.com/terraform/1.9.3/terraform_1.9.3_linux_amd64.zip
      - unzip terraform.zip
      - mv terraform /usr/local/bin/
      - terraform -version

  pre_build:
    commands:
      - echo Initializing Terraform...
      - terraform init -input=false

  build:
    commands:
      - echo Planning Terraform deployment...
      - terraform plan -input=false
      - echo Applying Terraform changes...
      - terraform apply -auto-approve -input=false

artifacts:
  files:
    - '**/*'
